spring.application.name=Tshop
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tshop}
spring.datasource.username=${POSTGRES_USER:tshop}
spring.datasource.password=${POSTGRES_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

minio.endpoint=${MINIO_ENDPOINT:http://localhost:${MINIO_PORT:9000}}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
minio.bucket=${MINIO_BUCKET:tshop}
minio.public-base-url=${MINIO_PUBLIC_BASE_URL:${MINIO_ENDPOINT:http://localhost:${MINIO_PORT:9000}}}

# JWT Configuration
jwt.secret=${JWT_SECRET:tshop-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# VNPay Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:RLTPPKHE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:OE8SXHZ96PLV0G3NL65P54QQTB5NVHQE}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment/vnpay-return}
vnpay.exchange-rate=${VNPAY_EXCHANGE_RATE:25000}

# GHN (GiaoHangNhanh) Configuration
ghn.token=${GHN_TOKEN:1b347b26-1863-11f1-8ebe-9e0b214fdae6}
ghn.shop-id=${GHN_SHOP_ID:199478}
ghn.api-url=${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2}
ghn.from-district-id=${GHN_FROM_DISTRICT_ID:1542}
