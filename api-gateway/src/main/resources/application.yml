server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: monolith-service
              uri: lb://MONOLITH-SERVICE
              predicates:
                - Path=/api/**
          # Temporarily routing all /api/** to monolith until we extract specific paths

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
