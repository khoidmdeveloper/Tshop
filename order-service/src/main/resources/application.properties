server.port=8084
spring.application.name=order-service
spring.config.import=optional:file:./.env[.properties]

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Order service uses tshop_order database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${ORDER_DB:tshop_order}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT secret (for verification)
jwt.secret=${JWT_SECRET}

# Integration Configs
ghn.api-url=${GHN_URL}
ghn.token=${GHN_TOKEN}
ghn.shop-id=${GHN_SHOP_ID}

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES}
vnpay.exchange-rate=${VNPAY_EXCHANGE_RATE}

# Services integration URLs
catalog-service.url=http://catalog-service

# Internal API Secret
internal.secret=${INTERNAL_SECRET}
