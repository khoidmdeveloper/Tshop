server.port=8083
spring.application.name=catalog-service
spring.config.import=optional:file:./.env[.properties]

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# Catalog service uses tshop_catalog database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CATALOG_DB:tshop_catalog}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT secret
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# MinIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
minio.bucket=${MINIO_BUCKET:tshop}
minio.public-base-url=${MINIO_PUBLIC_BASE_URL:${MINIO_ENDPOINT}}

# Internal API Secret
internal.secret=${INTERNAL_SECRET}
