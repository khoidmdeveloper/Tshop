services:
  postgres:
    image: postgres:16-alpine
    container_name: tshop-postgres
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-tshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tshop_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tshop-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tshop_minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: tshop-minio-init
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set tshop http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
      echo 'Waiting for MinIO...';
      sleep 2;
      done;
      mc mb --ignore-existing tshop/${MINIO_BUCKET:-tshop};
      "
    restart: "no"

volumes:
  tshop_pgdata:
  tshop_minio:
