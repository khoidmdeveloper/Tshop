services:
  postgres:
    image: postgres:16-alpine
    container_name: tshop-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-tshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tshop_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  minio:
    image: minio/minio:latest
    container_name: tshop-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tshop_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  minio-init:
    image: minio/mc:latest
    container_name: tshop-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set tshop http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
      echo 'Waiting for MinIO...';
      sleep 2;
      done;
      mc mb --ignore-existing tshop/${MINIO_BUCKET:-tshop};
      "
    restart: "no"

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: tshop-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tshop-auth-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTH_DB: ${AUTH_DB:-tshop_auth}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: tshop-catalog-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CATALOG_DB: ${CATALOG_DB:-tshop_catalog}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://localhost:9000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: tshop-order-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ORDER_DB: ${ORDER_DB:-tshop_order}
      VNPAY_RETURN_URL: http://localhost:8080/api/payment/vnpay-return
      VNPAY_IPN_URL: http://localhost:8080/api/payment/vnpay-ipn
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tshop-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_VND_EXCHANGE_RATE: ${VITE_VND_EXCHANGE_RATE:-25000}
    container_name: tshop-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  sonarqube:
    image: sonarqube:community
    container_name: tshop-sonarqube
    ports:
      - "9009:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - tshop_sonar_data:/opt/sonarqube/data
      - tshop_sonar_extensions:/opt/sonarqube/extensions
      - tshop_sonar_logs:/opt/sonarqube/logs
    restart: on-failure:3

volumes:
  tshop_pgdata:
  tshop_minio:
  tshop_sonar_data:
  tshop_sonar_extensions:
  tshop_sonar_logs: